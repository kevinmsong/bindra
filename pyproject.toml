[project]
name = "bindra"
version = "0.1.0.dev0"
description = "BINDRA — Binding INference, Design, Retrieval, and Attention"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"

# Python is pinned to 3.12 deliberately. The training stack needs CUDA 12.8+
# wheels for the RTX 5060 Ti (Blackwell, sm_120), and several chemistry and
# graph dependencies in this project's orbit have no 3.13 wheels at all.
dependencies = [
    "torch>=2.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "rdkit>=2024.3.1",
    "safetensors>=0.4",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# ESM-C 600M protein encoder. Kept optional so the scaffold, the data layer and
# the test suite remain installable without downloading encoder weights.
encoders = ["esm>=3.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
bindra = "bindra.cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bindra"]

# torch must come from the CUDA 12.8 index. The default PyPI wheel on Windows is
# CPU-only, which is exactly the failure this project is recovering from: the
# legacy DeepDTA-iBAM venv silently ran torch 2.9.1+cpu.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "owed: a spec requirement that is scaffolded but not yet implemented",
    "gpu: requires a working CUDA device",
    "encoders: requires downloaded pretrained encoder weights",
    "snapshot: requires the downloaded BindingDB snapshot",
]
